<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: cabecera(${esEgreso} ? 'Nuevo egreso' : 'Nuevo ingreso')}"></head>
<body class="con-menu">
<aside th:replace="~{layout/base :: menu}"></aside>
<main class="contenido">
    <h1 th:text="${esEgreso} ? 'Nuevo egreso' : 'Nuevo ingreso'">Movimiento</h1>

    <form class="formulario" th:action="${esEgreso} ? @{/finanzas/egresos} : @{/finanzas/ingresos}"
          th:object="${movimientoForm}" method="post">
        <p class="mensaje error" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>

        <th:block th:if="${esEgreso}">
            <label for="idProveedor">Proveedor (pago a proveedor)</label>
            <select id="idProveedor" th:field="*{idProveedor}">
                <option value="">— Otro gasto operativo —</option>
                <option th:each="p : ${proveedores}" th:value="${p.idProveedor}" th:text="${p.nombre}">Proveedor</option>
            </select>
        </th:block>

        <label for="concepto" th:text="${esEgreso} ? 'Concepto (obligatorio si no eliges proveedor)' : 'Concepto'">Concepto</label>
        <input id="concepto" th:field="*{concepto}" type="text" maxlength="150" autocomplete="off">
        <span class="campo-error" th:if="${#fields.hasErrors('concepto')}" th:errors="*{concepto}"></span>

        <label for="fecha">Fecha</label>
        <input id="fecha" th:field="*{fecha}" type="date" th:max="${hoy}">
        <span class="campo-error" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></span>

        <label for="valor">Valor</label>
        <input id="valor" th:field="*{valor}" type="number" step="0.01" min="0.01">
        <span class="campo-error" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></span>

        <div class="botones">
            <button type="submit">Guardar</button>
            <a class="boton secundario" th:href="@{/finanzas}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
