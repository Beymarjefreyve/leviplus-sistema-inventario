<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: cabecera(${esEgreso} ? 'Nuevo egreso' : 'Nuevo ingreso')}"></head>
<body>
<div class="app">
<aside th:replace="~{layout/base :: menu('finanzas')}"></aside>
<main class="main">
    <div th:replace="~{layout/base :: volver(@{/finanzas}, 'Ingresos y egresos')}"></div>
    <header class="page-h">
        <div>
            <span class="eyebrow">Movimientos financieros</span>
            <h1 th:text="${esEgreso} ? 'Registrar egreso' : 'Registrar otro ingreso'">Movimiento</h1>
            <p th:text="${esEgreso} ? 'Pago a un proveedor o cualquier otro gasto operativo.' : 'Ingreso distinto de la venta de productos.'">Descripción</p>
        </div>
    </header>

    <section class="card form">
        <form class="fld" th:action="${esEgreso} ? @{/finanzas/egresos} : @{/finanzas/ingresos}"
              th:object="${movimientoForm}" method="post">
            <div class="err" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>

            <label th:if="${esEgreso}">Proveedor (pago a proveedor)
                <select id="idProveedor" th:field="*{idProveedor}">
                    <option value="">— Otro gasto operativo —</option>
                    <option th:each="p : ${proveedores}" th:value="${p.idProveedor}" th:text="${p.nombre}">Proveedor</option>
                </select></label>

            <label><span th:text="${esEgreso} ? 'Concepto (obligatorio si no eliges proveedor)' : 'Concepto'">Concepto</span>
                <input id="concepto" th:field="*{concepto}" type="text" maxlength="150" autocomplete="off"
                       th:placeholder="${esEgreso} ? 'Ej. Servicios públicos, arriendo' : 'Ingreso distinto de la venta de productos'">
                <span class="campo-error" th:if="${#fields.hasErrors('concepto')}" th:errors="*{concepto}"></span></label>

            <div class="row2">
                <label>Fecha
                    <input id="fecha" th:field="*{fecha}" type="date" th:max="${hoy}">
                    <span class="campo-error" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></span></label>
                <label>Valor (COP)
                    <input id="valor" th:field="*{valor}" type="number" step="0.01" min="0.01" placeholder="$ 0">
                    <span class="campo-error" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></span></label>
            </div>

            <div class="form-actions">
                <button class="btn" type="submit" th:text="${esEgreso} ? 'Registrar egreso' : 'Registrar ingreso'">Guardar</button>
                <a class="btn sec" th:href="@{/finanzas}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</div>
</body>
</html>
