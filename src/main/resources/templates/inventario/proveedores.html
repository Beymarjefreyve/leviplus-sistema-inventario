<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: cabecera('Proveedores')}"></head>
<body>
<div class="app">
<aside th:replace="~{layout/base :: menu('proveedores')}"></aside>
<main class="main">
    <header class="page-h">
        <div>
            <span class="eyebrow">Inventario</span>
            <h1>Proveedores</h1>
            <p>Proveedores disponibles para asociar a las entradas de inventario y a los pagos.</p>
        </div>
        <div class="actions"><a class="btn" th:href="@{/proveedores/nuevo}">Nuevo proveedor</a></div>
    </header>

    <div class="msg ok" th:if="${ok}" th:text="${ok}"></div>
    <div class="msg error" th:if="${error}" th:text="${error}"></div>

    <section class="card flush">
        <div class="tools"><input type="search" data-filtra="tabla-proveedores" placeholder="Buscar por nombre, teléfono o correo" aria-label="Buscar" autocomplete="off"></div>
        <div class="tw">
            <table id="tabla-proveedores">
                <thead><tr><th>Proveedor</th><th>Teléfono</th><th>Correo electrónico</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody>
                <tr th:each="p : ${proveedores}">
                    <td><b th:text="${p.nombre}">Nombre</b></td>
                    <td th:text="${p.telefono}">Teléfono</td>
                    <td th:text="${p.correo} ?: '—'">Correo</td>
                    <td><span class="pill" th:classappend="${p.estaActivo()} ? '' : 'gray'"
                              th:text="${p.estaActivo()} ? 'Activo' : 'Inactivo'">Activo</span></td>
                    <td><div class="acc">
                        <a class="btn sm edit" th:href="@{/proveedores/{id}/editar(id=${p.idProveedor})}">Editar</a>
                        <form class="inline" th:if="${p.estaActivo()}" th:action="@{/proveedores/{id}/inactivar(id=${p.idProveedor})}" method="post"
                              onsubmit="return confirm('¿Inactivar este proveedor?');">
                            <button type="submit" class="btn sm off">Inactivar</button>
                        </form>
                        <form class="inline" th:unless="${p.estaActivo()}" th:action="@{/proveedores/{id}/reactivar(id=${p.idProveedor})}" method="post"
                              onsubmit="return confirm('¿Reactivar este proveedor? Volverá a estar disponible en las entradas y los pagos.');">
                            <button type="submit" class="btn sm on">Reactivar</button>
                        </form>
                    </div></td>
                </tr>
                <tr th:if="${#lists.isEmpty(proveedores)}"><td colspan="5" class="empty">No hay proveedores registrados.</td></tr>
                <tr class="sin-resultados"><td colspan="5" class="empty">No se encontraron resultados.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</div>
<script th:src="@{/js/tabla.js}"></script>
</body>
</html>
