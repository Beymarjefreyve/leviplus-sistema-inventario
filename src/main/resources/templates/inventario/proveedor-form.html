<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: cabecera(${proveedorEditado == null} ? 'Nuevo proveedor' : 'Editar proveedor')}"></head>
<body>
<div class="app">
<aside th:replace="~{layout/base :: menu('proveedores')}"></aside>
<main class="main">
    <div th:replace="~{layout/base :: volver(@{/proveedores}, 'Proveedores')}"></div>
    <header class="page-h">
        <div>
            <span class="eyebrow">Inventario</span>
            <h1 th:text="${proveedorEditado == null} ? 'Registrar proveedor' : 'Editar proveedor'">Proveedor</h1>
        </div>
    </header>

    <section class="card form">
        <form class="fld"
              th:action="${proveedorEditado == null} ? @{/proveedores} : @{/proveedores/{id}(id=${proveedorEditado.idProveedor})}"
              th:object="${proveedorForm}" method="post">
            <label>Nombre o razón social
                <input id="nombre" th:field="*{nombre}" type="text" maxlength="120" autofocus>
                <span class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span></label>

            <label>Teléfono
                <input id="telefono" th:field="*{telefono}" type="text" maxlength="20">
                <span class="campo-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></span></label>

            <label>Correo electrónico (opcional)
                <input id="correo" th:field="*{correo}" type="email" maxlength="120">
                <span class="campo-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></span></label>

            <div class="form-actions">
                <button class="btn" type="submit">Guardar</button>
                <a class="btn sec" th:href="@{/proveedores}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</div>
</body>
</html>
