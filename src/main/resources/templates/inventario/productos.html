<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: cabecera('Productos')}"></head>
<body class="con-menu">
<aside th:replace="~{layout/base :: menu}"></aside>
<main class="contenido">
    <div class="barra-titulo">
        <h1>Inventario de productos</h1>
        <a class="boton" th:href="@{/productos/nuevo}">Nuevo producto</a>
    </div>

    <p class="mensaje ok" th:if="${ok}" th:text="${ok}"></p>
    <p class="mensaje error" th:if="${error}" th:text="${error}"></p>

    <table class="tabla">
        <thead>
        <tr>
            <th>Código</th><th>Nombre</th><th>Presentación</th><th>Laboratorio</th>
            <th>Precio</th><th>Existencia</th><th>Estado</th><th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${productos}" th:with="existencia=${existencias.getOrDefault(p.idProducto, 0L)}">
            <td th:text="${p.codigoProducto}">COD</td>
            <td th:text="${p.nombre}">Nombre</td>
            <td th:text="${p.presentacion}">Presentación</td>
            <td th:text="${p.laboratorio}">Laboratorio</td>
            <td th:text="${#numbers.formatDecimal(p.precioVenta, 1, 'POINT', 2, 'COMMA')}">0,00</td>
            <td>
                <span th:text="${existencia}">0</span>
                <span class="etiqueta alerta" th:if="${p.estaActivo() and existencia <= p.stockMinimo}">Bajo stock</span>
            </td>
            <td><span class="etiqueta" th:classappend="${p.estaActivo()} ? 'activo' : 'inactivo'"
                      th:text="${p.estaActivo()} ? 'Activo' : 'Inactivo'">Activo</span></td>
            <td class="acciones">
                <a th:href="@{/productos/{id}/editar(id=${p.idProducto})}">Editar</a>
                <a th:if="${p.estaActivo()}" th:href="@{/productos/{id}/entrada(id=${p.idProducto})}">Entrada</a>
                <a th:if="${existencia > 0}" th:href="@{/productos/{id}/salida(id=${p.idProducto})}">Salida</a>
                <form th:if="${p.estaActivo()}" th:action="@{/productos/{id}/inactivar(id=${p.idProducto})}" method="post"
                      onsubmit="return confirm('¿Inactivar este producto? Dejará de estar disponible en nuevas entradas y ventas.');">
                    <button type="submit" class="peligro">Inactivar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(productos)}"><td colspan="8">No hay productos registrados.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
