<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: cabecera(${productoEditado == null} ? 'Nuevo producto' : 'Editar producto')}"></head>
<body>
<div class="app">
<aside th:replace="~{layout/base :: menu('productos')}"></aside>
<main class="main">
    <div th:replace="~{layout/base :: volver(@{/productos}, 'Productos')}"></div>
    <header class="page-h">
        <div>
            <span class="eyebrow">Inventario</span>
            <h1 th:text="${productoEditado == null} ? 'Registrar producto' : 'Editar producto'">Producto</h1>
            <p th:text="${productoEditado == null} ? 'Agregue un producto al catálogo. Quedará sin existencias hasta que registre una entrada.' : 'Actualice los datos del producto. Las ventas ya registradas conservan su precio.'">Descripción</p>
        </div>
    </header>

    <section class="card form wide">
        <form class="fld"
              th:action="${productoEditado == null} ? @{/productos} : @{/productos/{id}(id=${productoEditado.idProducto})}"
              th:object="${productoForm}" method="post">
            <div class="err" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>

            <label>Código del producto
                <input id="codigoProducto" th:field="*{codigoProducto}" type="text" maxlength="50" autofocus autocomplete="off">
                <span class="ayuda">Puedes digitarlo o leerlo con el lector de código de barras.</span>
                <span class="campo-error" th:if="${#fields.hasErrors('codigoProducto')}" th:errors="*{codigoProducto}"></span></label>

            <label>Nombre
                <input id="nombre" th:field="*{nombre}" type="text" maxlength="100" placeholder="Ej. Ibuprofeno 400 mg">
                <span class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span></label>

            <div class="row2">
                <label>Presentación
                    <input id="presentacion" th:field="*{presentacion}" type="text" maxlength="80" placeholder="Ej. Tableta x 10">
                    <span class="campo-error" th:if="${#fields.hasErrors('presentacion')}" th:errors="*{presentacion}"></span></label>
                <label>Laboratorio
                    <input id="laboratorio" th:field="*{laboratorio}" type="text" maxlength="80">
                    <span class="campo-error" th:if="${#fields.hasErrors('laboratorio')}" th:errors="*{laboratorio}"></span></label>
            </div>

            <div class="row3">
                <label>Precio de venta (COP)
                    <input id="precioVenta" th:field="*{precioVenta}" type="number" step="0.01" min="0">
                    <span class="campo-error" th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}"></span></label>
                <label>Stock mínimo
                    <input id="stockMinimo" th:field="*{stockMinimo}" type="number" step="1" min="0">
                    <span class="campo-error" th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}"></span></label>
                <label>Días de alerta de vencimiento
                    <input id="diasAlertaVencimiento" th:field="*{diasAlertaVencimiento}" type="number" step="1" min="0">
                    <span class="campo-error" th:if="${#fields.hasErrors('diasAlertaVencimiento')}" th:errors="*{diasAlertaVencimiento}"></span></label>
            </div>
            <p class="hint">El stock mínimo activa la alerta de bajo stock y los días de alerta indican con cuánta anticipación se avisa el vencimiento de cada lote.</p>

            <div class="form-actions">
                <button class="btn" type="submit">Guardar</button>
                <a class="btn sec" th:href="@{/productos}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</div>
</body>
</html>
