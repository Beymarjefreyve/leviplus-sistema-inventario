<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: cabecera(${productoEditado == null} ? 'Nuevo producto' : 'Editar producto')}"></head>
<body class="con-menu">
<aside th:replace="~{layout/base :: menu}"></aside>
<main class="contenido">
    <h1 th:text="${productoEditado == null} ? 'Nuevo producto' : 'Editar producto'">Producto</h1>

    <form class="formulario"
          th:action="${productoEditado == null} ? @{/productos} : @{/productos/{id}(id=${productoEditado.idProducto})}"
          th:object="${productoForm}" method="post">
        <p class="mensaje error" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>

        <label for="codigoProducto">Código del producto</label>
        <input id="codigoProducto" th:field="*{codigoProducto}" type="text" maxlength="50" autofocus
               autocomplete="off">
        <span class="ayuda">Puedes digitarlo o leerlo con el lector de código de barras.</span>
        <span class="campo-error" th:if="${#fields.hasErrors('codigoProducto')}" th:errors="*{codigoProducto}"></span>

        <label for="nombre">Nombre</label>
        <input id="nombre" th:field="*{nombre}" type="text" maxlength="100">
        <span class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>

        <label for="presentacion">Presentación</label>
        <input id="presentacion" th:field="*{presentacion}" type="text" maxlength="80">
        <span class="campo-error" th:if="${#fields.hasErrors('presentacion')}" th:errors="*{presentacion}"></span>

        <label for="laboratorio">Laboratorio</label>
        <input id="laboratorio" th:field="*{laboratorio}" type="text" maxlength="80">
        <span class="campo-error" th:if="${#fields.hasErrors('laboratorio')}" th:errors="*{laboratorio}"></span>

        <label for="precioVenta">Precio de venta</label>
        <input id="precioVenta" th:field="*{precioVenta}" type="number" step="0.01" min="0">
        <span class="campo-error" th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}"></span>

        <label for="stockMinimo">Stock mínimo</label>
        <input id="stockMinimo" th:field="*{stockMinimo}" type="number" step="1" min="0">
        <span class="campo-error" th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}"></span>

        <label for="diasAlertaVencimiento">Días de alerta de vencimiento</label>
        <input id="diasAlertaVencimiento" th:field="*{diasAlertaVencimiento}" type="number" step="1" min="0">
        <span class="campo-error" th:if="${#fields.hasErrors('diasAlertaVencimiento')}" th:errors="*{diasAlertaVencimiento}"></span>

        <div class="botones">
            <button type="submit">Guardar</button>
            <a class="boton secundario" th:href="@{/productos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
