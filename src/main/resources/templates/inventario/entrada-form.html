<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: cabecera('Registrar entrada')}"></head>
<body class="con-menu">
<aside th:replace="~{layout/base :: menu}"></aside>
<main class="contenido">
    <h1>Registrar entrada</h1>
    <p class="resumen">
        <strong th:text="${producto.nombre}">Producto</strong> · <span th:text="${producto.presentacion}">Presentación</span><br>
        Existencia actual: <strong th:text="${existencia}">0</strong>
    </p>

    <form class="formulario" th:action="@{/productos/{id}/entrada(id=${producto.idProducto})}"
          th:object="${entradaForm}" method="post">
        <p class="mensaje error" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>

        <label for="idProveedor">Proveedor</label>
        <select id="idProveedor" th:field="*{idProveedor}">
            <option value="">Selecciona un proveedor</option>
            <option th:each="p : ${proveedores}" th:value="${p.idProveedor}" th:text="${p.nombre}">Proveedor</option>
        </select>
        <span class="ayuda" th:if="${#lists.isEmpty(proveedores)}">No hay proveedores activos; registra uno primero.</span>
        <span class="campo-error" th:if="${#fields.hasErrors('idProveedor')}" th:errors="*{idProveedor}"></span>

        <label for="codigoLote">Lote</label>
        <input id="codigoLote" th:field="*{codigoLote}" type="text" maxlength="40" autocomplete="off">
        <span class="campo-error" th:if="${#fields.hasErrors('codigoLote')}" th:errors="*{codigoLote}"></span>

        <label for="fechaVencimiento">Fecha de vencimiento</label>
        <input id="fechaVencimiento" th:field="*{fechaVencimiento}" type="date">
        <span class="campo-error" th:if="${#fields.hasErrors('fechaVencimiento')}" th:errors="*{fechaVencimiento}"></span>

        <label for="cantidad">Cantidad recibida</label>
        <input id="cantidad" th:field="*{cantidad}" type="number" step="1" min="1">
        <span class="campo-error" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></span>

        <div class="botones">
            <button type="submit">Registrar entrada</button>
            <a class="boton secundario" th:href="@{/productos}">Cancelar</a>
        </div>
    </form>

    <table class="tabla" th:if="${!#lists.isEmpty(lotes)}">
        <thead><tr><th>Lote</th><th>Vence</th><th>Disponible</th></tr></thead>
        <tbody>
        <tr th:each="l : ${lotes}">
            <td th:text="${l.codigoLote}">L1</td>
            <td th:text="${l.fechaVencimiento}">2027-01-01</td>
            <td th:text="${l.cantidadDisponible}">0</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
