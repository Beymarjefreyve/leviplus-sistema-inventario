<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: cabecera(${usuarioEditado == null} ? 'Nuevo usuario' : 'Editar usuario')}"></head>
<body>
<div class="app">
<aside th:replace="~{layout/base :: menu('usuarios')}"></aside>
<main class="main">
    <div th:replace="~{layout/base :: volver(@{/usuarios}, 'Usuarios')}"></div>
    <header class="page-h">
        <div>
            <span class="eyebrow">Autenticación y usuarios</span>
            <h1 th:text="${usuarioEditado == null} ? 'Nuevo usuario' : 'Editar usuario'">Usuario</h1>
        </div>
    </header>

    <section class="card form">
        <form class="fld"
              th:action="${usuarioEditado == null} ? @{/usuarios} : @{/usuarios/{id}(id=${usuarioEditado.idUsuario})}"
              th:object="${usuarioForm}" method="post">
            <div class="err" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>

            <label>Nombre completo
                <input id="nombreCompleto" th:field="*{nombreCompleto}" type="text" maxlength="100">
                <span class="campo-error" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></span></label>

            <label>Nombre de usuario
                <input id="nombreUsuario" th:field="*{nombreUsuario}" type="text" maxlength="50"
                       th:readonly="${usuarioEditado != null}" autocomplete="off">
                <span class="campo-error" th:if="${#fields.hasErrors('nombreUsuario')}" th:errors="*{nombreUsuario}"></span></label>

            <label><span th:text="${usuarioEditado == null} ? 'Contraseña' : 'Nueva contraseña (opcional)'">Contraseña</span>
                <input id="contrasena" th:field="*{contrasena}" type="password" maxlength="72" autocomplete="new-password">
                <span class="ayuda">Mínimo 8 caracteres.</span>
                <span class="campo-error" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></span></label>

            <label>Rol
                <select id="rol" th:field="*{rol}">
                    <option value="">Selecciona un rol</option>
                    <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.nombre}">Rol</option>
                </select>
                <span class="campo-error" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></span></label>

            <div class="form-actions">
                <button class="btn" type="submit">Guardar</button>
                <a class="btn sec" th:href="@{/usuarios}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</div>
</body>
</html>
