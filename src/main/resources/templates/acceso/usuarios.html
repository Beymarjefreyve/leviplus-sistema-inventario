<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: cabecera('Usuarios')}"></head>
<body class="con-menu">
<aside th:replace="~{layout/base :: menu}"></aside>
<main class="contenido">
    <div class="barra-titulo">
        <h1>Usuarios</h1>
        <a class="boton" th:href="@{/usuarios/nuevo}">Nuevo usuario</a>
    </div>

    <p class="mensaje ok" th:if="${ok}" th:text="${ok}"></p>
    <p class="mensaje error" th:if="${error}" th:text="${error}"></p>

    <table class="tabla">
        <thead>
        <tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.nombreCompleto}">Nombre</td>
            <td th:text="${u.nombreUsuario}">usuario</td>
            <td th:text="${u.rol.nombre}">Rol</td>
            <td><span class="etiqueta" th:classappend="${u.estaActivo()} ? 'activo' : 'inactivo'"
                      th:text="${u.estaActivo()} ? 'Activo' : 'Inactivo'">Activo</span></td>
            <td class="acciones">
                <a th:href="@{/usuarios/{id}/editar(id=${u.idUsuario})}">Editar</a>
                <form th:if="${u.estaActivo()}" th:action="@{/usuarios/{id}/desactivar(id=${u.idUsuario})}" method="post"
                      onsubmit="return confirm('¿Desactivar este usuario? No podrá ingresar al sistema.');">
                    <button type="submit" class="peligro">Desactivar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="5">No hay usuarios registrados.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
