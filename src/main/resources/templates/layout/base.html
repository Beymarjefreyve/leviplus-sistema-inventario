<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Levi Plus'">Levi Plus</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<aside th:fragment="menu" class="menu">
    <div class="marca">Levi Plus</div>
    <nav>
        <a th:href="@{/}">Inicio</a>
        <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/productos}">Productos</a>
        <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/proveedores}">Proveedores</a>
        <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/usuarios}">Usuarios</a>
    </nav>
    <form th:action="@{/logout}" method="post" class="cerrar-sesion">
        <button type="submit">Cerrar sesión</button>
    </form>
</aside>

</body>
</html>
