<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Levi Plus'">Levi Plus</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!--
  Menu lateral comun. Solo muestra las opciones permitidas para el rol (ayuda de usabilidad);
  la autorizacion real se aplica en el servidor con @PreAuthorize en cada controlador.
  Cada modulo agrega aqui sus enlaces cuando se implementa.
-->
<aside th:fragment="menu" class="menu">
    <div class="marca">Levi Plus</div>
    <nav>
        <a th:href="@{/}">Inicio</a>
        <!-- Iteracion 1: usuarios, productos, proveedores, entradas y salidas -->
        <!-- Iteracion 2: ventas, historial, devoluciones, clientes y pedidos -->
        <!-- Iteracion 3: ingresos, egresos y balance -->
        <!-- Iteracion 4: alertas, existencias y reportes -->
    </nav>
    <form th:action="@{/logout}" method="post" class="cerrar-sesion">
        <button type="submit">Cerrar sesión</button>
    </form>
</aside>

</body>
</html>
