<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: cabecera('Nuevo cliente')}"></head>
<body>
<div class="app">
<aside th:replace="~{layout/base :: menu('clientes')}"></aside>
<main class="main">
    <div th:replace="~{layout/base :: volver(@{/clientes}, 'Clientes frecuentes')}"></div>
    <header class="page-h">
        <div>
            <span class="eyebrow">Ventas</span>
            <h1>Registrar cliente frecuente</h1>
        </div>
    </header>

    <section class="card form">
        <form class="fld" th:action="@{/clientes}" th:object="${clienteForm}" method="post">
            <label>Nombre
                <input id="nombre" th:field="*{nombre}" type="text" maxlength="100" autocomplete="off" autofocus>
                <span class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span></label>

            <label>Teléfono de contacto
                <input id="telefono" th:field="*{telefono}" type="tel" maxlength="20" autocomplete="off">
                <span class="campo-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></span></label>

            <div class="form-actions">
                <button class="btn" type="submit">Guardar</button>
                <a class="btn sec" th:href="@{/clientes}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</div>
</body>
</html>
