<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error · Levi Plus</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="pagina-acceso">
<main class="tarjeta-acceso">
    <h1 th:text="${status == 403} ? 'Sin permiso' : (${status == 404} ? 'Página no encontrada' : 'Ocurrió un problema')">Error</h1>
    <p th:if="${status == 403}">Tu rol no tiene permiso para realizar esta acción.</p>
    <p th:if="${status == 404}">La página que buscas no existe.</p>
    <p th:unless="${status == 403 or status == 404}">No se pudo completar la operación. Intenta de nuevo.</p>
    <p><a th:href="@{/}">Volver al inicio</a></p>
</main>
</body>
</html>
