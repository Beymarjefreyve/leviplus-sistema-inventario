spring.application.name=leviplus
server.port=${PORT:8080}

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

spring.thymeleaf.cache=true
spring.web.locale=es_CO
spring.jackson.time-zone=America/Bogota

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

leviplus.admin.usuario=${LEVIPLUS_ADMIN_USER:}
leviplus.admin.contrasena=${LEVIPLUS_ADMIN_PASSWORD:}
leviplus.admin.nombre=${LEVIPLUS_ADMIN_NOMBRE:Administrador}
