# Configuracion comun. Los valores sensibles llegan por variables de entorno (ver .env.example).
spring.application.name=leviplus
server.port=${PORT:8080}

# En local, lee las variables del archivo .env (ignorado por git). En Cloud Run llegan como variables de entorno.
spring.config.import=optional:file:./.env[.properties]

# Base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema se crea con src/main/resources/db/esquema.sql; Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# Vistas y zona horaria
spring.thymeleaf.cache=true
spring.web.locale=es_CO
spring.jackson.time-zone=America/Bogota

# Sesion: cookie protegida y expiracion por inactividad
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Salud para Cloud Run (solo /actuator/health expuesto)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Administrador inicial (se crea solo si la tabla usuario esta vacia)
leviplus.admin.usuario=${LEVIPLUS_ADMIN_USER:}
leviplus.admin.contrasena=${LEVIPLUS_ADMIN_PASSWORD:}
leviplus.admin.nombre=${LEVIPLUS_ADMIN_NOMBRE:Administrador}
