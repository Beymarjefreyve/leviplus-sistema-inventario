services:
  db:
    image: postgres:16
    container_name: leviplus-db
    environment:
      POSTGRES_DB: leviplus
      POSTGRES_USER: ${DB_USER:-leviplus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/main/resources/db/esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro

volumes:
  pgdata:
